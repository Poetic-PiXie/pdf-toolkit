<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Toolkit</title>
<meta name="description" content="Split, merge, extract, delete and rotate PDF pages, and convert between PDFs and images. Free, and your files never leave your device.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PDF Toolkit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --card-hover: #fbfbfd;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(0,0,0,.10);
  --line-strong: rgba(0,0,0,.18);
  --accent: #0a66d8;
  --accent-soft: rgba(10,102,216,.10);
  --ok: #1f8a4c;
  --ok-soft: rgba(31,138,76,.10);
  --warn: #b4541a;
  --warn-soft: rgba(229,110,40,.12);
  --error: #c4302b;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618;
    --card: #222225;
    --card-hover: #28282c;
    --text: #f2f2f4;
    --muted: #a1a1a8;
    --line: rgba(255,255,255,.10);
    --line-strong: rgba(255,255,255,.20);
    --accent: #4c9bff;
    --accent-soft: rgba(76,155,255,.14);
    --ok: #4cc27f;
    --ok-soft: rgba(76,194,127,.13);
    --warn: #f0a060;
    --warn-soft: rgba(240,160,96,.13);
    --error: #ff6b63;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 48px; }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 10px; padding: 16px 0 6px; }
.topbar .appicon { width: 30px; height: 30px; border-radius: 7px; }
.topbar .by { font-weight: 500; color: var(--muted); }
.topbar .pixie-logo { height: 64px; width: auto; border-radius: 9px; display: block; }
@media (max-width: 520px) { .privacy span { display: none; } .topbar .pixie-logo { height: 48px; } }
.topbar .brand { font-weight: 650; font-size: 17px; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 10px; }
.privacy { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.privacy svg { width: 15px; height: 15px; }

/* Home */
.hero { padding: 26px 0 20px; }
.hero h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
.card {
  display: flex; gap: 14px; align-items: flex-start; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); cursor: pointer; width: 100%;
  transition: border-color .15s, transform .15s, background .15s;
  text-decoration: none; color: inherit;
}
.card:hover { border-color: var(--tint); background: var(--card-hover); }
.card:active { transform: scale(.985); }
.card:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; border-color: var(--accent); }
.card.disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.card.disabled:hover { border-color: var(--line); background: var(--card); }
.card.disabled:active { transform: none; }
.card-title { font-weight: 620; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card-sub { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.badge { font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 99px; background: var(--line); color: var(--muted); letter-spacing: .01em; }
.ticon {
  flex: none; width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(180deg, color-mix(in srgb, var(--tint) 80%, white), var(--tint));
  color: #fff;
}
.ticon svg { width: 23px; height: 23px; }
.ticon.small { width: 36px; height: 36px; border-radius: 9px; }
.ticon.small svg { width: 19px; height: 19px; }
.pixie { display: block; width: 100%; max-width: 560px; height: auto; margin: 28px auto 0; border-radius: 18px; box-shadow: var(--shadow); }
.foot { margin-top: 20px; color: var(--muted); font-size: 13px; text-align: center; }

/* Tool screen */
.back { display: inline-flex; align-items: center; gap: 4px; padding: 8px 2px; text-decoration: none; font-size: 15px; }
.back svg { width: 16px; height: 16px; }
.tool-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px; }
.tool-head h1 { font-size: clamp(22px, 4.5vw, 28px); margin: 0; letter-spacing: -.01em; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
@media (max-width: 520px) { .panel { padding: 16px; } }
.step { display: flex; align-items: center; gap: 10px; font-weight: 620; margin: 24px 0 12px; }
.panel > .step:first-child { margin-top: 0; }
.step .n { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none; }
.hint { color: var(--muted); font-size: 14.5px; margin: 8px 0 0; }
.hint.error { color: var(--error); }
.hint:empty { display: none; }

/* Drop zone & file card */
.dropzone {
  border: 2px dashed var(--line-strong); border-radius: var(--radius); padding: 28px 16px;
  text-align: center; cursor: pointer; transition: background .15s, border-color .15s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.dropzone:hover, .drag .dropzone { border-color: var(--accent); background: var(--accent-soft); }
.dropzone:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
.dropzone svg { width: 34px; height: 34px; color: var(--muted); margin-bottom: 4px; }
.dz-title { font-weight: 620; color: var(--accent); }
.dz-sub { color: var(--muted); font-size: 14px; }
.drop-only { display: inline; }
@media (hover: none) { .drop-only { display: none; } }
.filecard { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.drag .filecard { border-color: var(--accent); }
.fileicon { width: 34px; height: 40px; flex: none; }
.fc-text { min-width: 0; flex: 1; }
.fc-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--muted); font-size: 14px; }
.loading { opacity: .6; pointer-events: none; }

/* File list */
.filelist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.drag .filelist { border-color: var(--accent); }
.filelist li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--card); }
.filelist li:first-child { border-top: 0; }
.filelist li:nth-child(even) { background: var(--bg); }
.fl-num { color: var(--muted); width: 26px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.fl-thumb { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex: none; background: var(--line); }
.fl-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.iconbtn:hover:not(:disabled) { background: var(--line); color: var(--text); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.iconbtn svg { width: 18px; height: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.spacer { flex: 1; }

/* Controls */
.btn {
  appearance: none; border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px;
  padding: 8px 14px; cursor: pointer; font-size: 15px; font-weight: 550; text-decoration: none; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
}
.btn:hover { background: var(--card-hover); border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { padding: 12px 24px; font-size: 16px; min-width: 180px; min-height: 48px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.danger { color: var(--error); }
.btn svg { width: 17px; height: 17px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; min-height: 32px; }
.option input[type=radio] { width: 19px; height: 19px; margin: 0; accent-color: var(--accent); flex: none; }
.sub-option { margin: 2px 0 0 29px; }
input[type=text], input[type=number], select {
  border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px; padding: 9px 12px;
  font-size: 16px; min-height: 42px; width: 100%; max-width: 340px;
}
input.num { width: 76px; text-align: center; }
input:focus, select:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; gap: 3px; background: var(--bg); flex-wrap: wrap; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 14px; border-radius: 8px; font-size: 15px; font-weight: 550; cursor: pointer; }
.seg input:checked + span { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.field { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
@media (max-width: 420px) { .field { grid-template-columns: 1fr; } }
.namefield { display: flex; align-items: center; gap: 6px; max-width: 420px; }
.namefield input { max-width: none; }

/* Status */
.status { margin-top: 16px; border-radius: 12px; padding: 14px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.status.working { background: var(--accent-soft); align-items: center; }
.status.done { background: var(--ok-soft); }
.status.failed { background: var(--warn-soft); }
.status-msg { flex: 1 1 260px; display: flex; gap: 8px; align-items: flex-start; }
.status-msg svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.status.done .status-msg svg { color: var(--ok); }
.status.failed .status-msg svg { color: var(--warn); }
.status-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.spinner { width: 18px; height: 18px; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.go-row { margin-top: 18px; }
[hidden] { display: none !important; }
.noscript { padding: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="#"><img class="appicon" src="apple-touch-icon.png" alt="">PDF Toolkit</a>
    <span class="privacy" title="Everything happens in your browser. Nothing is uploaded.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Files stay on your device</span>
    </span>
  </header>
  <main id="app"></main>
  <noscript><p class="noscript">PDF Toolkit needs JavaScript turned on.</p></noscript>
</div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script>
'use strict';
const { PDFDocument, degrees } = PDFLib;

/* ---------- Icons ---------- */
const svg = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  split: svg('<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>'),
  merge: svg('<path d="M6 3v5a6 6 0 0 0 6 6 6 6 0 0 1 6 6v1M18 3v5a6 6 0 0 1-3 5.2"/><path d="m3 6 3-3 3 3M15 6l3-3 3 3"/>'),
  extract: svg('<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/>'),
  delete: svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14M10 11v6M14 11v6"/>'),
  rotate: svg('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'),
  toimages: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L5 21"/>'),
  fromimages: svg('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><circle cx="9.5" cy="12.5" r="1.5"/><path d="m20 17-3.5-3.5L8 21"/>'),
  toword: svg('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="m8 13 1.5 5 2.5-4 2.5 4 1.5-5"/>'),
  back: svg('<path d="m15 18-6-6 6-6"/>'),
  up: svg('<path d="m18 15-6-6-6 6"/>'),
  down: svg('<path d="m6 9 6 6 6-6"/>'),
  remove: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  drop: svg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>'),
  check: svg('<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>'),
  warn: svg('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
  download: svg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>'),
  share: svg('<path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),
};
const PDF_FILE_ICON = `<svg class="fileicon" viewBox="0 0 34 40" aria-hidden="true"><path d="M3 0h20l11 11v26a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V3a3 3 0 0 1 3-3z" fill="#e5484d"/><path d="M23 0v8a3 3 0 0 0 3 3h8z" fill="#fff" opacity=".45"/><text x="17" y="31" fill="#fff" font-size="9" font-weight="700" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif">PDF</text></svg>`;

/* ---------- Tools ---------- */
const TOOLS = [
  { id: 'split', title: 'Split PDF', sub: 'Break a PDF into separate files.', tint: '#e5484d' },
  { id: 'merge', title: 'Merge several PDF files', sub: 'Join PDFs into one, in the order you choose.', tint: '#3e63dd' },
  { id: 'extract', title: 'Extract pages', sub: 'Copy selected pages into a new PDF.', tint: '#12a594' },
  { id: 'delete', title: 'Delete pages', sub: "Remove pages you don't need.", tint: '#d6409f' },
  { id: 'rotate', title: 'Rotate pages', sub: 'Turn some or all pages.', tint: '#f76b15' },
  { id: 'toimages', title: 'Convert PDF to images', sub: 'Save pages as PNG or JPEG images.', tint: '#8e4ec6' },
  { id: 'fromimages', title: 'Combine images into a PDF', sub: 'Turn photos or scans into one PDF.', tint: '#30a46c' },
  { id: 'toword', title: 'Convert PDF to Word', sub: 'Turn a PDF into an editable document.', tint: '#6e56cf', disabled: true },
];

/* ---------- Helpers ---------- */
const app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const baseName = (name) => name.replace(/\.[^./]+$/, '') || 'file';
const safeName = (name) => name.replace(/[\\/:*?"<>|]+/g, '-').trim();
const isPDF = (f) => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
const isImage = (f) => f.type.startsWith('image/') || /\.(jpe?g|png|heic|heif|webp|gif|bmp|tiff?)$/i.test(f.name);
const tick = () => new Promise((r) => setTimeout(r, 0));
class ToolError extends Error {}

const step = (n, title) => `<div class="step"><span class="n">${n}</span><span>${esc(title)}</span></div>`;

function parseList(text, count) {
  const out = [];
  const seen = new Set();
  for (let tok of text.replace(/[–—]/g, '-').split(',')) {
    tok = tok.trim();
    if (!tok) continue;
    const m = tok.match(/^(\d+)\s*(?:-\s*(\d+))?$/);
    if (!m) throw new ToolError(`“${tok}” isn't a page number or a range like 2-5.`);
    const a = +m[1], b = m[2] ? +m[2] : a;
    if (a < 1 || b > count || a > b) throw new ToolError(`“${tok}” is outside pages 1–${count}.`);
    for (let p = a; p <= b; p++) if (!seen.has(p)) { seen.add(p); out.push(p); }
  }
  if (!out.length) throw new ToolError('Enter at least one page.');
  return out;
}

function parseBreaks(text, count) {
  const nums = new Set();
  for (let tok of text.split(',')) {
    tok = tok.trim();
    if (!tok) continue;
    if (!/^\d+$/.test(tok)) throw new ToolError(`“${tok}” isn't a page number.`);
    const n = +tok;
    if (n < 1 || n >= count) throw new ToolError(`Break points must be between 1 and ${count - 1}.`);
    nums.add(n);
  }
  if (!nums.size) throw new ToolError('Type the page numbers where each file should end.');
  return [...nums].sort((a, b) => a - b);
}

const chunksEvery = (n, count) => {
  const out = [];
  for (let s = 1; s <= count; s += n) out.push([s, Math.min(s + n - 1, count)]);
  return out;
};
const chunksAt = (breaks, count) => {
  const out = [];
  let s = 1;
  for (const b of breaks) { out.push([s, b]); s = b + 1; }
  out.push([s, count]);
  return out;
};
const range = ([a, b]) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const chunkLabel = ([a, b]) => (a === b ? `${a}` : `${a}-${b}`);
const allPages = (count) => range([1, count]);

function attempt(fn) {
  try { return { ok: true, value: fn() }; }
  catch (e) { return { ok: false, error: e.message }; }
}

async function loadPDF(file) {
  const bytes = await file.arrayBuffer();
  try {
    return await PDFDocument.load(bytes, { updateMetadata: false });
  } catch (e) {
    if (/encrypt/i.test(e.message)) throw new ToolError(`“${file.name}” is password-protected. Unlock it first.`);
    throw new ToolError(`Couldn't open “${file.name}”. Is it a valid PDF?`);
  }
}

async function docFromPages(src, pages) {
  const out = await PDFDocument.create();
  const copied = await out.copyPages(src, pages.map((p) => p - 1));
  copied.forEach((p) => out.addPage(p));
  return out;
}

const pdfBlob = async (doc) => new Blob([await doc.save()], { type: 'application/pdf' });

async function zipBlob(folder, entries) {
  const zip = new JSZip();
  const dir = zip.folder(folder);
  for (const e of entries) dir.file(e.name, e.data);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/zip' });
}

let pdfjsPromise = null;
function getPdfjs() {
  if (!pdfjsPromise) {
    pdfjsPromise = import('./vendor/pdf.min.mjs').then((m) => {
      m.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.min.mjs', document.baseURI).href;
      return m;
    });
  }
  return pdfjsPromise;
}

/* ---------- Components ---------- */

// Single-PDF picker. Calls onChange({file, doc, pageCount}).
function pdfPicker(el, onChange) {
  let state = null;
  const input = Object.assign(document.createElement('input'), { type: 'file', accept: 'application/pdf,.pdf', hidden: true });

  function render(error) {
    el.innerHTML = state
      ? `<div class="filecard">${PDF_FILE_ICON}<div class="fc-text"><div class="fc-name">${esc(state.file.name)}</div><div class="muted">${plural(state.pageCount, 'page')}</div></div><button type="button" class="btn" data-choose>Change…</button></div>`
      : `<div class="dropzone" data-choose role="button" tabindex="0">${ICON.drop}<div class="dz-title">Choose a PDF</div><div class="dz-sub"><span class="drop-only">or drop it here</span></div></div>`;
    if (error) el.insertAdjacentHTML('beforeend', `<p class="hint error">${esc(error)}</p>`);
    el.appendChild(input);
  }

  async function load(file) {
    el.classList.add('loading');
    try {
      const doc = await loadPDF(file);
      state = { file, doc, pageCount: doc.getPageCount() };
      render();
      onChange(state);
    } catch (e) {
      render(e.message);
    } finally {
      el.classList.remove('loading');
    }
  }

  el.addEventListener('click', (e) => { if (e.target.closest('[data-choose]')) input.click(); });
  el.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.dropzone')) { e.preventDefault(); input.click(); }
  });
  input.addEventListener('change', () => { if (input.files[0]) load(input.files[0]); input.value = ''; });
  addDrop(el, (files) => {
    const f = files.find(isPDF);
    f ? load(f) : render("That isn't a PDF file.");
  });
  render();
}

// Ordered list of files. Calls onChange(files).
function fileList(el, { accept, isOk, label, addLabel, thumbs }, onChange) {
  let files = [];
  const urls = new Map();
  const input = Object.assign(document.createElement('input'), { type: 'file', accept, multiple: true, hidden: true });

  const thumb = (f) => {
    if (!thumbs) return PDF_FILE_ICON;
    if (!urls.has(f)) urls.set(f, URL.createObjectURL(f));
    return `<img class="fl-thumb" src="${urls.get(f)}" alt="" onerror="this.style.visibility='hidden'">`;
  };

  function render() {
    if (!files.length) {
      el.innerHTML = `<div class="dropzone" data-act="add" role="button" tabindex="0">${ICON.drop}<div class="dz-title">${esc(addLabel)}</div><div class="dz-sub"><span class="drop-only">or drop ${esc(label)} here</span></div></div>`;
    } else {
      el.innerHTML = `<ol class="filelist">${files.map((f, i) => `
        <li>
          <span class="fl-num">${i + 1}.</span>${thumb(f)}
          <span class="fl-name">${esc(f.name)}</span>
          <button type="button" class="iconbtn" data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ICON.up}</button>
          <button type="button" class="iconbtn" data-act="down" data-i="${i}" ${i === files.length - 1 ? 'disabled' : ''} aria-label="Move down">${ICON.down}</button>
          <button type="button" class="iconbtn" data-act="remove" data-i="${i}" aria-label="Remove">${ICON.remove}</button>
        </li>`).join('')}</ol>
        <div class="row">
          <button type="button" class="btn" data-act="add">${esc(addLabel)}</button>
          <button type="button" class="btn" data-act="sort">Sort by name</button>
          <span class="spacer"></span>
          <button type="button" class="btn danger" data-act="clear">Clear all</button>
        </div>
        <p class="hint">Use the arrows to change the order.</p>`;
    }
    el.appendChild(input);
  }

  function changed() { render(); onChange(files); }

  function add(list) {
    let skipped = 0;
    for (const f of list) {
      if (!isOk(f)) { skipped++; continue; }
      if (!files.some((x) => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) files.push(f);
    }
    changed();
    if (skipped) el.insertAdjacentHTML('beforeend', `<p class="hint error">${plural(skipped, 'file')} skipped: not ${esc(label)}.</p>`);
  }

  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const i = +b.dataset.i;
    switch (b.dataset.act) {
      case 'add': input.click(); return;
      case 'up': [files[i - 1], files[i]] = [files[i], files[i - 1]]; break;
      case 'down': [files[i + 1], files[i]] = [files[i], files[i + 1]]; break;
      case 'remove': { const [f] = files.splice(i, 1); if (urls.has(f)) { URL.revokeObjectURL(urls.get(f)); urls.delete(f); } break; }
      case 'sort': files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })); break;
      case 'clear': urls.forEach((u) => URL.revokeObjectURL(u)); urls.clear(); files = []; break;
    }
    changed();
  });
  el.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.dropzone')) { e.preventDefault(); input.click(); }
  });
  input.addEventListener('change', () => { add([...input.files]); input.value = ''; });
  addDrop(el, add);
  render();
}

function addDrop(el, onFiles) {
  let depth = 0;
  el.addEventListener('dragenter', (e) => { e.preventDefault(); depth++; el.classList.add('drag'); });
  el.addEventListener('dragover', (e) => { e.preventDefault(); });
  el.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; el.classList.remove('drag'); } });
  el.addEventListener('drop', (e) => {
    e.preventDefault(); depth = 0; el.classList.remove('drag');
    const files = [...(e.dataTransfer?.files || [])];
    if (files.length) onFiles(files);
  });
}

// Result / progress box.
function statusBox(el) {
  let url = null;
  const clearUrl = () => { if (url) { URL.revokeObjectURL(url); url = null; } };
  return {
    working(msg) {
      el.innerHTML = `<div class="status working" role="status"><span class="spinner"></span><span>${esc(msg)}</span></div>`;
    },
    error(msg) {
      clearUrl();
      el.innerHTML = `<div class="status failed" role="alert"><div class="status-msg">${ICON.warn}<span>${esc(msg)}</span></div></div>`;
    },
    done(msg, out) {
      clearUrl();
      url = URL.createObjectURL(out.blob);
      el.innerHTML = `<div class="status done" role="status">
        <div class="status-msg">${ICON.check}<span>${esc(msg)}</span></div>
        <div class="status-actions">
          <a class="btn primary" href="${url}" download="${esc(out.name)}">${ICON.download}Download</a>
        </div></div>`;
    },
    clear() { clearUrl(); el.innerHTML = ''; },
  };
}

// Runs a job with progress, results and errors.
async function runJob(btn, status, label, job) {
  btn.disabled = true;
  btn.dataset.busy = '1';
  status.working(label);
  await new Promise((r) => setTimeout(r, 30));
  try {
    const { msg, out } = await job((m) => status.working(m));
    status.done(msg, out);
  } catch (e) {
    console.error(e);
    status.error(e instanceof ToolError ? e.message : `Something went wrong: ${e.message || e}`);
  } finally {
    delete btn.dataset.busy;
    btn.dispatchEvent(new Event('refresh', { bubbles: true }));
  }
}

const nameField = (value) => `<label class="namefield"><input type="text" data-name value="${esc(value)}" aria-label="File name" autocomplete="off" spellcheck="false"><span class="muted">.pdf</span></label>`;

const pagesScope = (name, placeholder) => `
  <div class="options">

    <label class="option"><input type="radio" name="${name}" value="some"> Only these pages:</label>

      <input type="text" data-pages placeholder="${placeholder}" autocomplete="off">
      <p class="hint" data-pages-hint></p>
    </div>
  </div>`;

function pagesHint(text, plan, describe) {
  if (!text.trim()) return { text: 'Separate pages with commas, and use a dash for ranges.', error: false };
  return plan.ok ? { text: describe(plan.value), error: false } : { text: plan.error, error: true };
}

function setHint(el, h) {
  el.textContent = h.text;
  el.classList.toggle('error', !!h.error);
}

        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        const blob = await new Promise((r) => canvas.toBlob(r, mime, 0.9));
        if (!blob) throw new ToolError(`Couldn't create the image for page ${n}.`);
        entries.push({ name: `${base}_${n}.${ext}`, data: blob });
        page.cleanup();
      }
      canvas.width = canvas.height = 0;
      await pdf.destroy();
      if (entries.length === 1) {
        return { msg: `Created ${entries[0].name}.`, out: { blob: entries[0].data, name: entries[0].name } };
      }
      progress('Packing ZIP file…');
      const folder = `${base} images`;
      const blob = await zipBlob(folder, entries);
      return { msg: `Created ${plural(entries.length, 'image')} in a folder named “${folder}”.`, out: { blob, name: `${folder}.zip` } };
    });
  });
};

VIEWS.fromimages = (body) => {
  body.innerHTML = `
    ${step(1, 'Add images, in page order')}<div data-list></div>
    ${step(2, 'Page size')}
    <div class="seg" role="radiogroup" aria-label="Page size">
      <label><input type="radio" name="size" value="fit" checked><span>Fit each image</span></label>
      <label><input type="radio" name="size" value="letter"><span>US Letter</span></label>
      <label><input type="radio" name="size" value="a4"><span>A4</span></label>
    </div>
    <p class="hint" data-size-hint></p>
    ${step(3, 'Name the PDF')}${nameField('Images')}
    <div class="go-row"><button type="button" class="btn primary big" data-go disabled>Create PDF</button></div>
    <div data-status></div>`;
  const $ = (s) => body.querySelector(s);
  const status = statusBox($('[data-status]'));
  let files = [];
  const size = () => body.querySelector('input[name=size]:checked').value;

  function update() {
    $('[data-size-hint]').textContent = size() === 'fit'
      ? 'Each page takes the shape of its image.'
      : 'Each image is centered on the page, turned to landscape when the image is wider than tall.';
    $('[data-go]').textContent = files.length ? `Create PDF from ${plural(files.length, 'image')}` : 'Create PDF';
    $('[data-go]').disabled = !files.length || !!$('[data-go]').dataset.busy;
  }
  fileList($('[data-list]'), { accept: 'image/*', isOk: isImage, label: 'images', addLabel: 'Add images…', thumbs: true }, (f) => { files = f; status.clear(); update(); });
  body.addEventListener('change', update);
  body.addEventListener('refresh', update);
  update();

  $('[data-go]').addEventListener('click', () => {
    const list = [...files];
    const mode = size();
    const name = readName(body, 'Images');
    runJob($('[data-go]'), status, 'Creating PDF…', async (progress) => {
      const out = await PDFDocument.create();
      for (let i = 0; i < list.length; i++) {
        progress(`Adding image ${i + 1} of ${list.length}…`);
        const { bytes, png } = await normalizeImage(list[i]);
        const img = png ? await out.embedPng(bytes) : await out.embedJpg(bytes);
        const landscape = img.width > img.height;
        let pw, ph, margin;
        if (mode === 'fit') {
          const long = 842; // A4 long side, in points
          const s = long / Math.max(img.width, img.height);
          pw = img.width * s; ph = img.height * s; margin = 0;
        } else {
          [pw, ph] = mode === 'a4' ? [595.28, 841.89] : [612, 792];
          if (landscape) [pw, ph] = [ph, pw];
          margin = 24;
        }
        const s = Math.min((pw - 2 * margin) / img.width, (ph - 2 * margin) / img.height);
        const w = img.width * s, h = img.height * s;
        out.addPage([pw, ph]).drawImage(img, { x: (pw - w) / 2, y: (ph - h) / 2, width: w, height: h });
      }
      return { msg: `Created ${name} with ${plural(out.getPageCount(), 'page')}.`, out: { blob: await pdfBlob(out), name } };
    });
  });
};

// Decodes any image the browser can show (including iPhone HEIC photos), applies
// its orientation, limits its size, and re-encodes it as JPEG or PNG for the PDF.
async function normalizeImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    try { await img.decode(); } catch (_) { throw new ToolError(`Couldn't read “${file.name}” as an image.`); }
    const maxSide = 4096;
    const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.naturalWidth * s));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * s));
    const ctx = canvas.getContext('2d');
    const png = /png|gif|webp/i.test(file.type) || /\.(png|gif|webp)$/i.test(file.name);
    if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((r) => canvas.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.92));
    canvas.width = canvas.height = 0;
    if (!blob) throw new ToolError(`Couldn't process “${file.name}”.`);
    return { bytes: new Uint8Array(await blob.arrayBuffer()), png };
  } finally {
    URL.revokeObjectURL(url);
  }
}

function renderHome() {
  document.title = 'PDF Toolkit';
  app.innerHTML = `
    <section class="hero">
      <h1>What would you like to do?</h1>
      <p>Pick a tool to get started. Everything runs in your browser, so your files are never uploaded.</p>
    </section>
    <div class="grid">
      ${TOOLS.map((t) => t.disabled
        ? `<div class="card disabled" style="--tint:${t.tint}" aria-disabled="true" title="Not available yet">
             <span class="ticon">${ICON[t.id]}</span>
             <span><span class="card-title">${esc(t.title)} <span class="badge">Coming soon</span></span><span class="card-sub" style="display:block">${esc(t.sub)}</span></span>
           </div>`
        : `<a class="card" href="#${t.id}" style="--tint:${t.tint}">
             <span class="ticon">${ICON[t.id]}</span>

}

function renderTool(t) {
  document.title = `${t.title} · PDF Toolkit`;
  app.innerHTML = `
    <a class="back" href="#">${ICON.back}All tools</a>
    <div class="tool-head"><span class="ticon small" style="--tint:${t.tint}">${ICON[t.id]}</span><h1>${esc(t.title)}</h1></div>
    <div class="panel" data-body></div>`;
  VIEWS[t.id](app.querySelector('[data-body]'));
}

function route() {
  const id = location.hash.slice(1);
  const t = TOOLS.find((x) => x.id === id && !x.disabled);
  t ? renderTool(t) : renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

// Ignore files dropped outside a drop zone instead of opening them in the tab.
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
